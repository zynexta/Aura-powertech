<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 72" fill="none" class="h-10 w-auto">
  <!-- Brand Symbol -->
  <g transform="translate(4, 4)">
    <!-- Sun Core & Aura Waves -->
    <defs>
      <linearGradient id="auraSunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#FF8A3D" />
        <stop offset="100%" stop-color="#F47721" />
      </linearGradient>
      <linearGradient id="auraBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#3C43A8" />
        <stop offset="100%" stop-color="#30358B" />
      </linearGradient>
    </defs>
    <!-- Outer Dynamic Power Tech Arc -->
    <path d="M 32 4 A 28 28 0 0 1 60 32 A 28 28 0 0 1 42 58 L 38 52 A 21 21 0 0 0 53 32 A 21 21 0 0 0 32 11 Z" fill="url(#auraBlueGrad)" />
    <!-- Rising Solar Rays / Petals -->
    <path d="M 4 32 A 28 28 0 0 1 32 4 L 32 11 A 21 21 0 0 0 11 32 Z" fill="url(#auraSunGrad)" />
    <!-- Inner Solar Panel Cell Grid / Sun Orb -->
    <circle cx="32" cy="32" r="13" fill="url(#auraSunGrad)" />
    <path d="M 23 32 L 41 32 M 32 23 L 32 41" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" />
    <!-- Energy Spark Accent -->
    <circle cx="50" cy="18" r="3.5" fill="#F47721" />
    <circle cx="14" cy="46" r="3.5" fill="#30358B" />
  </g>

  <!-- Typography -->
  <g transform="translate(80, 0)">
    <text x="0" y="38" font-family="'Manrope', 'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="28" letter-spacing="0.08em" fill="#30358B">
      AURA
    </text>
    <text x="96" y="38" font-family="'Manrope', 'Plus Jakarta Sans', system-ui, sans-serif" font-weight="400" font-size="14" letter-spacing="0.16em" fill="#F47721">
      SOLAR
    </text>
    <text x="0" y="55" font-family="'Inter', system-ui, sans-serif" font-weight="700" font-size="9" letter-spacing="0.28em" fill="#52587A">
      POWERTECH SOLUTIONS
    </text>
  </g>
</svg>
